name: Bug report
description: Report a problem with the unofficial NeoForge port
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for VulkanMod NeoForge (Unofficial), maintained by Aviello.
        Report port-specific problems here, not to the original VulkanMod team.
        Check existing issues before submitting. Please write in English and remove
        account tokens, server addresses and other private information from logs.
  - type: input
    id: version
    attributes:
      label: Mod and NeoForge versions
      placeholder: VulkanMod 0.4.8-neoforge.4 / NeoForge 21.1.252
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, GPU and driver version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether the problem occurs with only this mod installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files and crash reports
      description: Attach logs/latest.log and any relevant crash report.
    validations:
      required: true
